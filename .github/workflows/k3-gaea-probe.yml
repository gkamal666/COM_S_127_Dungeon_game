name: K3 GAEA probe

on:
  push:
    branches:
      - k3-gaea-probe-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade "numpy<3" scipy
      - name: Run synthetic calibration
        run: python k3_gaea_probe.py --synthetic-only > synthetic-control.json
      - name: Run real K3 gauge-alignment probe
        run: |
          python k3_gaea_probe.py \
            --layer 12 \
            --experts 16 \
            --sketch 64 \
            --mode-samples 1000000 \
            --cache work/cache \
            --out work/result
      - name: Preserve measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3-gaea-layer12-e16
          path: |
            work/result/result.json
            work/result/REPORT.md
            synthetic-control.json
          if-no-files-found: error
          retention-days: 30
